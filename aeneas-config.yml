# Aeneas extraction configuration
# Used by `npm run aeneas-{install,extract}` to run charon and aeneas for Lean code generation.
#
# The `rev` in lakefile.toml MUST be kept in sync with `aeneas.tag`.

aeneas:
  tag: "nightly-2026.08.27-5b9dcf3"   # GitHub release tag
  repo: "https://github.com/AeneasVerif/aeneas.git"

crate:
  dir: "curve25519-dalek"
  name: "curve25519_dalek"

charon:
  # start_from / exclude / opaque are read natively by Charon from
  # [package.metadata.charon] in curve25519-dalek/Cargo.toml.
  preset: aeneas
  # Extract both serial backends (32- and 64-bit) in one shot
  targets:
    - x86_64-unknown-linux-gnu
    - i686-unknown-linux-gnu
  rustflags:
    - "--cfg"
    - 'curve25519_dalek_backend="serial"'
  cargo_args:
    - "--no-default-features"
    - "--features"
    - "alloc,zeroize"

aeneas_args:
  # NOTE: no `loops-to-rec` — we keep the default loop output.
  # `emit-json` writes translation.json alongside the generated Lean files.
  options:
    - split-files
    - emit-json
  dest: "curve25519-dalek"        # dest dir; root import file -> curve25519-dalek/translated.lean
  subdir: "translated"            # output -> curve25519-dalek/translated/, import prefix `translated`

# Post-extraction tweaks applied to generated Lean files.
# Each substitution is either a literal `find` (all occurrences) or a `regex`,
# applied IN ORDER. Regex substitutions may reference capture groups with `$1` etc.
tweaks:
  files:
    - "Funs.lean"
    - "Types.lean"
    - "FunsExternal_Template.lean"
    - "TypesExternal_Template.lean"
  substitutions:
    # --- Avoid linter complaints ---

    - find: "set_option linter.unusedVariables false"
      replace: |-
        set_option linter.unusedVariables false
        set_option linter.style.whitespace false
        set_option linter.style.setOption false
        set_option linter.style.longLine false

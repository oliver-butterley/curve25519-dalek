# Aeneas extraction configuration
# Used by `npm run aeneas-{install,extract}` to run charon and aeneas for Lean code generation.

# The aeneas version (`rev`) and repo (`git`) live in the `aeneas` require of lakefile.toml
# (single source of truth). `aeneas-install` and `aeneas-extract` read them from there.

crate:
  dir: "curve25519-dalek"
  name: "curve25519_dalek"

charon:
  preset: aeneas
  targets:
    - x86_64-unknown-linux-gnu   # -> curve25519_dalek_bits="64" (via build.rs)
    - i686-unknown-linux-gnu     # -> curve25519_dalek_bits="32" (via build.rs)
  rustflags:
    - '--cfg=curve25519_dalek_backend="serial"'
  cargo_args:
    # Drop precomputed-tables. Reactivate when https://github.com/AeneasVerif/aeneas/issues/1098 is fixed.
    - "--no-default-features"
    - "--features"
    - "alloc,zeroize"

aeneas_args:
  options:
    - split-files
    - emit-json
  dest: "curve25519-dalek/lean"
  subdir: "Curve25519Dalek"

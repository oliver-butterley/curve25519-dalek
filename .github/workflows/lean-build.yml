name: Lean build

# Build all Lean libraries and run the linter.

on:
  push:
    branches: [ '**' ]
    paths: &paths
      - 'curve25519-dalek/lean/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean-build.yml'
  pull_request:
    branches: [ '**' ]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: true
          # Strict: everything except the Specs library, whose proofs may still be `sorry` during
          # the campaign. Add completed audit modules here (see verif-guidelines.md).
          build-args: --wfail Curve25519Dalek Subtle Zeroize Curve25519 Specs.Backend.Serial.U64.Field Specs.Backend.Serial.U64.Constants Specs.Backend.Serial.U64.Scalar Specs.Field

      # Lenient: sorry warnings allowed. The `#guard_msgs` axiom lines in each audit file still
      # fail the build if a statement's axioms change.
      - name: Build Specs
        run: lake build Specs

      - name: Lint hand-written libraries
        run: lake exe runLinter Subtle Zeroize Curve25519 Specs

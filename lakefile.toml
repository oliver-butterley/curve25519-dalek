name = "curve25519-dalek"
version = "0.1.0"
keywords = ["formal verification"]
defaultTargets = ["translated"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxRecDepth = 10000

# The `rev` MUST be kept in sync with `aeneas.tag` in aeneas-config.yml.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "nightly-2026.08.27-5b9dcf3"

[[lean_lib]]
name = "Subtle"
srcDir = "curve25519-dalek"

# Aeneas-generated Lean translation
[[lean_lib]]
name = "translated"
srcDir = "curve25519-dalek"

# Hand-written proofs
# [[lean_lib]]
# name = "proofs"
# srcDir = "curve25519-dalek"

[package]
name = "curve25519-dalek"
# Before incrementing:
# - update CHANGELOG
# - update README if required by semver
version = "5.0.0-rc.1"
edition = "2024"
rust-version = "1.85.0"
authors = [
    "Isis Lovecruft <isis@patternsinthevoid.net>",
    "Henry de Valence <hdevalence@hdevalence.ca>",
]
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/dalek-cryptography/curve25519-dalek/tree/main/curve25519-dalek"
homepage = "https://github.com/dalek-cryptography/curve25519-dalek"
documentation = "https://docs.rs/curve25519-dalek"
categories = ["cryptography", "no-std"]
keywords = ["cryptography", "crypto", "ristretto", "curve25519", "ristretto255"]
description = "A pure-Rust implementation of group operations on ristretto255 and Curve25519"
exclude = ["**/.gitignore", ".gitignore"]

[package.metadata.docs.rs]
rustdoc-args = [
    "--html-in-header",
    "docs/assets/rustdoc-include-katex-header.html",
    "--cfg",
    "docsrs",
]
all-features = true

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
criterion = { version = "0.5", features = ["html_reports"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4.2"
proptest = "1"
sha2 = { version = "0.11", default-features = false }

[build-dependencies]
rustc_version = "0.4.0"

[[bench]]
name = "dalek_benchmarks"
harness = false
required-features = ["alloc", "rand_core"]

[dependencies]
cfg-if = "1"
ff = { version = "0.14", default-features = false, optional = true }
group = { version = "0.14", default-features = false, optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }
digest = { version = "0.11", default-features = false, optional = true, features = ["block-api"] }
subtle = { version = "2.6.0", default-features = false, features = [
    "const-generics",
] }
serde = { version = "1.0", default-features = false, optional = true, features = [
    "derive",
] }
zeroize = { version = "1", default-features = false, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures = "0.3"

[target.'cfg(curve25519_dalek_backend = "fiat")'.dependencies]
fiat-crypto = { version = "0.3.0", default-features = false }

[features]
default = ["alloc", "precomputed-tables", "zeroize"]
alloc = ["zeroize?/alloc"]
precomputed-tables = []
legacy_compatibility = []
group = ["dep:group", "rand_core"]
digest = ["dep:digest"]
lizard = ["digest"]

[target.'cfg(all(not(curve25519_dalek_backend = "fiat"), not(curve25519_dalek_backend = "serial"), target_arch = "x86_64"))'.dependencies]
curve25519-dalek-derive = "0.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(allow_unused_unsafe)',
    'cfg(curve25519_dalek_backend, values("fiat", "serial", "simd", "avx512"))',
    'cfg(curve25519_dalek_diagnostics, values("build"))',
    'cfg(curve25519_dalek_bits, values("32", "64"))',
    'cfg(nightly)',
]

[package.metadata.charon]
start_from = [
  "curve25519_dalek",
]
exclude = [
  # TODO: bits_le returns `impl DoubleEndedIterator + '_` -> Aeneas "Internal error" 
  # https://github.com/AeneasVerif/aeneas/issues/1207
  "curve25519_dalek::scalar::_::bits_le",
  # Debug impls (use core::fmt::Formatter; not translatable, not of interest)
  "curve25519_dalek::backend::serial::curve_models::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u64::field::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u64::scalar::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u32::field::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u32::scalar::{impl core::fmt::Debug for _}",
  "curve25519_dalek::montgomery::{impl core::fmt::Debug for _}",
  "curve25519_dalek::scalar::{impl core::fmt::Debug for _}",
  "curve25519_dalek::ristretto::{impl core::fmt::Debug for _}",
  "curve25519_dalek::edwards::{impl core::fmt::Debug for _}",
  "curve25519_dalek::edwards::affine::{impl core::fmt::Debug for _}",
  # Hash impls (use core::hash::Hasher; not translatable, not of interest)
  "curve25519_dalek::montgomery::{impl core::hash::Hash for _}",
  "curve25519_dalek::scalar::{impl core::hash::Hash for _}",
  "curve25519_dalek::ristretto::{impl core::hash::Hash for _}",
  "curve25519_dalek::edwards::{impl core::hash::Hash for _}",
  # Derived `Eq` impls
  "curve25519_dalek::edwards::{impl core::cmp::Eq for _}",
  "curve25519_dalek::edwards::affine::{impl core::cmp::Eq for _}",
  "curve25519_dalek::field::{impl core::cmp::Eq for _}",
  "curve25519_dalek::montgomery::{impl core::cmp::Eq for _}",
  "curve25519_dalek::ristretto::{impl core::cmp::Eq for _}",
  "curve25519_dalek::scalar::{impl core::cmp::Eq for _}",
]
opaque = [
  # Closure/iterator bodies Aeneas can't translate:
  "curve25519_dalek::ristretto::_::double_and_compress_batch",
  # TODO: montgomery `Mul` calls the excluded scalar::bits_le and so must be opaque
  "curve25519_dalek::montgomery::{impl core::ops::arith::Mul<_> for _}::mul",
  # Multiscalar-mul: these use Iterator combinators (map/zip/fold/sum/product/collect)
  # TODO: lift these once the Iterator provided-method models land.
  # https://github.com/AeneasVerif/aeneas/issues/1057
  # https://github.com/AeneasVerif/aeneas/issues/1207
  "curve25519_dalek::scalar::read_le_u64_into",
  "curve25519_dalek::scalar::{impl core::iter::traits::accum::Sum<_> for _}::sum",
  "curve25519_dalek::scalar::{impl core::iter::traits::accum::Product<_> for _}::product",
  "curve25519_dalek::edwards::{impl core::iter::traits::accum::Sum<_> for _}::sum",
  "curve25519_dalek::ristretto::{impl core::iter::traits::accum::Sum<_> for _}::sum",
  # The multiscalar-mul required impl methods:
  # TODO: lift these once the Iterator provided-method models land.
  # https://github.com/AeneasVerif/aeneas/issues/1057
  # https://github.com/AeneasVerif/aeneas/issues/1207
  "curve25519_dalek::backend::serial::scalar_mul::straus::_::multiscalar_mul",
  "curve25519_dalek::backend::serial::scalar_mul::straus::_::optional_multiscalar_mul",
  "curve25519_dalek::backend::serial::scalar_mul::pippenger::_::optional_multiscalar_mul",
  "curve25519_dalek::backend::serial::scalar_mul::precomputed_straus::_::new",
  "curve25519_dalek::backend::serial::scalar_mul::precomputed_straus::_::optional_mixed_multiscalar_mul",
  "curve25519_dalek::edwards::_::multiscalar_mul",
  "curve25519_dalek::edwards::_::optional_multiscalar_mul",
  "curve25519_dalek::edwards::_::new",
  "curve25519_dalek::edwards::_::optional_mixed_multiscalar_mul",
  "curve25519_dalek::ristretto::_::multiscalar_mul",
  "curve25519_dalek::ristretto::_::optional_multiscalar_mul",
  "curve25519_dalek::ristretto::_::new",
  "curve25519_dalek::ristretto::_::optional_mixed_multiscalar_mul",
]

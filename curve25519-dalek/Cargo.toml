[package]
name = "curve25519-dalek"
# Before incrementing:
# - update CHANGELOG
# - update README if required by semver
version = "5.0.0-rc.1"
edition = "2024"
rust-version = "1.85.0"
authors = [
    "Isis Lovecruft <isis@patternsinthevoid.net>",
    "Henry de Valence <hdevalence@hdevalence.ca>",
]
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/dalek-cryptography/curve25519-dalek/tree/main/curve25519-dalek"
homepage = "https://github.com/dalek-cryptography/curve25519-dalek"
documentation = "https://docs.rs/curve25519-dalek"
categories = ["cryptography", "no-std"]
keywords = ["cryptography", "crypto", "ristretto", "curve25519", "ristretto255"]
description = "A pure-Rust implementation of group operations on ristretto255 and Curve25519"
exclude = ["**/.gitignore", ".gitignore"]

[package.metadata.docs.rs]
rustdoc-args = [
    "--html-in-header",
    "docs/assets/rustdoc-include-katex-header.html",
    "--cfg",
    "docsrs",
]
all-features = true

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
criterion = { version = "0.5", features = ["html_reports"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4.2"
proptest = "1"
sha2 = { version = "0.11", default-features = false }

[build-dependencies]
rustc_version = "0.4.0"

[[bench]]
name = "dalek_benchmarks"
harness = false
required-features = ["alloc", "rand_core"]

[dependencies]
cfg-if = "1"
ff = { version = "0.14", default-features = false, optional = true }
group = { version = "0.14", default-features = false, optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }
digest = { version = "0.11", default-features = false, optional = true, features = ["block-api"] }
subtle = { version = "2.6.0", default-features = false, features = [
    "const-generics",
] }
serde = { version = "1.0", default-features = false, optional = true, features = [
    "derive",
] }
zeroize = { version = "1", default-features = false, optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures = "0.3"

[target.'cfg(curve25519_dalek_backend = "fiat")'.dependencies]
fiat-crypto = { version = "0.3.0", default-features = false }

[features]
default = ["alloc", "precomputed-tables", "zeroize"]
alloc = ["zeroize?/alloc"]
precomputed-tables = []
legacy_compatibility = []
group = ["dep:group", "rand_core"]
digest = ["dep:digest"]
lizard = ["digest"]

[target.'cfg(all(not(curve25519_dalek_backend = "fiat"), not(curve25519_dalek_backend = "serial"), target_arch = "x86_64"))'.dependencies]
curve25519-dalek-derive = "0.1"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(allow_unused_unsafe)',
    'cfg(curve25519_dalek_backend, values("fiat", "serial", "simd", "avx512"))',
    'cfg(curve25519_dalek_diagnostics, values("build"))',
    'cfg(curve25519_dalek_bits, values("32", "64"))',
    'cfg(nightly)',
]

[package.metadata.charon]

# Goal: translate as much of the crate as possible with NO Aeneas errors (Class 1);
# Lean-build errors (Class 2) are deferred. Start from the whole crate (serial
# backend selected via cfg); only items that make Aeneas itself error go in `opaque`.
start_from = [
  "curve25519_dalek",
]
exclude = [
  # Debug impls (use core::fmt::Formatter; not translatable, not of interest)
  "curve25519_dalek::backend::serial::curve_models::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u64::field::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u64::scalar::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u32::field::{impl core::fmt::Debug for _}",
  "curve25519_dalek::backend::serial::u32::scalar::{impl core::fmt::Debug for _}",
  "curve25519_dalek::montgomery::{impl core::fmt::Debug for _}",
  "curve25519_dalek::scalar::{impl core::fmt::Debug for _}",
  "curve25519_dalek::ristretto::{impl core::fmt::Debug for _}",
  "curve25519_dalek::edwards::{impl core::fmt::Debug for _}",
  "curve25519_dalek::edwards::affine::{impl core::fmt::Debug for _}",
  # Hash impls (use core::hash::Hasher; not translatable, not of interest)
  "curve25519_dalek::montgomery::{impl core::hash::Hash for _}",
  "curve25519_dalek::scalar::{impl core::hash::Hash for _}",
  "curve25519_dalek::ristretto::{impl core::hash::Hash for _}",
  "curve25519_dalek::edwards::{impl core::hash::Hash for _}",
]
# NOTE: a number of functions (iterator/closure/borrow-heavy: invert_batch,
# mul_bits_be, bits_le, batch compress, pippenger fold, etc.) currently fail to
# translate in Aeneas. These are distinct Aeneas issues to be fixed upstream and
# are documented in doc/aeneas-extraction-issues.md. `opaque` is NOT a workaround:
# Charon's metadata `opaque` does not suppress the failing closures, and these
# functions have callers so they cannot be `exclude`d cleanly either.
# scalar_mul (9 fns) — checked per-function; ALL are blocked in the current
# backend-only scope, so the whole module is opaque. Two blocking causes:
#  (a) intrinsic: straus/precomputed_straus/pippenger take `I: IntoIterator` and
#      chain iterator ADAPTERS (.map/.zip/.collect/.rev/.chunks). Under Charon
#      `--targets` (translate_all_methods) this emits `impl Iterator for
#      {Map,Zip,Chunks,...}` with provided methods Aeneas's Iterator model lacks
#      ("zip/map ... not a field of Iterator") -> unbuildable.
#  (b) transitive: variable_base::mul / vartime_double_base::mul are themselves
#      translatable (index loops + curve_models point ops), but pull in the
#      top-level `scalar`, `window` (Naf/LookupTable) and `edwards` code, which has
#      its own adapter/Scalar-projection/IterMut bugs.
# Revisit (a) when the upstream charon translate_all_methods bug is fixed, and (b)
# once the higher-level modules are translated. curve_models uses no iterators and
# stays transparent.
# Only items that make AENEAS ITSELF error (Class 1) belong here. `scalar_mul` was
# removed: Aeneas translates it without error; its problems are Class 2 (the Lean
# it produces doesn't compile — charon translate_all_methods Iterator bug + the
# `scalar`-module shadowing), which we are deferring. Populate this list from the
# Aeneas [Error]/partial-file output of a whole-crate run.
opaque = [
  # Class-1 Aeneas errors (own-body constructs Aeneas can't translate).
  # NOTE: inherent impl methods can't be matched directly; the documented workaround
  # is `crate::module::_::method` (the `_` matches the inherent impl block).
  "curve25519_dalek::scalar::_::bits_le",
  "curve25519_dalek::ristretto::_::double_and_compress_batch",
]
